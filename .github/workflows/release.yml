name: release

# Triggered by pushing a tag like "v1.0.0" (see .claude/plans/07-phase7-docker-release.md).
# Plain `go build` (matrix over GOOS/GOARCH) + `gh release create`; no
# goreleaser, to keep this workflow easy to read end-to-end. The
# version is embedded into the binary the same way as the Dockerfile
# does, via -ldflags -X internal/cli.version.
#
# workflow_dispatch runs only the test and docker jobs, with a
# simulated tag, so the image build and tag derivation can be verified
# without pushing a real git tag. It builds but does not push unless
# the "push" input is set, and a manual push only ever goes to an
# isolated manual-<run id> tag: the ref a manual run builds from need
# not match inputs.version, so letting it write release tags would
# break the guarantee that the image named after a git tag was built
# from that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to simulate (e.g. v0.2.0-rc.1)'
        required: true
      push:
        description: 'Push the image to GHCR (isolated manual-<run id> tag only)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    # Binaries and the GitHub release only make sense for a real tag
    # push; workflow_dispatch is for verifying the docker job.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/diagoram-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/shimabox/diagoram/internal/cli.version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/diagoram
          (cd dist && tar -c "$(basename "$out")" | gzip -9 > "$(basename "$out").tar.gz" && rm "$(basename "$out")")
          (cd dist && shasum -a 256 *.tar.gz > "diagoram-${GOOS}-${GOARCH}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: diagoram-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # Only the build job's binaries; without this pattern the
          # docker job's auto-uploaded *.dockerbuild record artifact is
          # also downloaded and ends up in the release assets.
          pattern: diagoram-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image_tag
        # Docker convention: image tags drop the "v" prefix (v0.2.0 ->
        # 0.2.0). "latest" is only added for a strict stable X.Y.Z tag, so
        # a prerelease like v0.2.0-rc.1 or a non-semver tag like v0.2 /
        # vnext does not move it.
        env:
          # The real tag on push, the simulated one on workflow_dispatch.
          REF_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          tags="ghcr.io/${GITHUB_REPOSITORY}:${version}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=$'\n'"ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
          echo "release tags for ${REF_NAME}:"
          echo "$tags"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual runs must never write release tags (see the header
            # comment); the derived tags above are for verification only.
            tags="ghcr.io/${GITHUB_REPOSITORY}:manual-${GITHUB_RUN_ID}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          # Don't upload the build record artifact; it is not a release
          # asset and confuses unfiltered artifact downloads.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Tag pushes always publish; manual runs only when asked to.
          push: ${{ github.event_name == 'push' || inputs.push }}
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
          tags: ${{ steps.image_tag.outputs.tags }}
